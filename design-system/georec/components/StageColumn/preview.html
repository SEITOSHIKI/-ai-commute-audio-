<body class="gr-root">
<div class="gr-stages"><div class="gr-stage"><h3 class="table-strong">準備期（1年目）</h3><ul class="table"><li><b>製品がない段階での受注</b>→ 有償試験導入を3社に限定</li><li><b>創業者が律速になる</b>→ 現場ヒアリングを手順書化</li><li><b>発注者側の様式変更</b>→ 様式定義をデータ構造から分離</li></ul></div><div class="gr-stage"><h3 class="table-strong">中期（2〜3年目）</h3><ul class="table"><li><b>個社対応による受託化</b>→ 共通機能8割・個社対応2割を明文化</li><li><b>採用の難しさ</b>→ 施工管理経験者にITを教える経路</li><li><b>母数の小ささ</b>→ 利用ログから解約兆候を早期検知</li></ul></div><div class="gr-stage"><h3 class="table-strong">後期（4〜5年目）</h3><ul class="table"><li><b>大手の領域参入</b>→ 蓄積した設備データが障壁</li><li><b>顧客の内製化</b>→ 基盤の維持と標準化で課金</li><li><b>属人経営からの脱却</b>→ 権限委譲と意思決定基準の明文化</li></ul></div></div>
</body>
